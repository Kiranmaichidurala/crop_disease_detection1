<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Disease Result</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <header>
        <h1>🌱 Prediction Result</h1>
    </header>

    <div class="result-box">

        <div class="result-left">
            <h2>Disease Detected:</h2>
            <p class="disease-name">{{ disease }}</p>

            <h3>Preventive Methods</h3>
            <p class="methods">{{ methods }}</p>

            <a href="/" class="back-btn">🔙 Go Back</a>
        </div>

        <div class="result-right">
            <h3>Your Uploaded Image</h3>
            <img src="{{ img_path }}" class="result-image" alt="Plant Image">
        </div>

    </div>

</body>
</html>
